
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 7.3 - Product Listing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>ShopZone</h1>
        <p>Discover products you'll love</p>
    </header>

    <main class="container">
        <h2 class="section-title">Featured Products</h2>

        <section class="product-container">

            <!-- Product 1 -->
            <div class="product-card">
                <img src="https://placehold.co/400x300/e8eef8/14213d?text=Headphones"
                     alt="Wireless headphones">
                <div class="product-info">
                    <h3>Wireless Headphones</h3>
                    <p class="price">₹1,499</p>
                    <button type="button">Add to Cart</button>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <img src="https://placehold.co/400x300/fce7f3/831843?text=Smartwatch"
                     alt="Smartwatch">
                <div class="product-info">
                    <h3>Smartwatch</h3>
                    <p class="price">₹2,499</p>
                    <button type="button">Add to Cart</button>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <img src="https://placehold.co/400x300/dcfce7/166534?text=Backpack"
                     alt="Travel backpack">
                <div class="product-info">
                    <h3>Travel Backpack</h3>
                    <p class="price">₹999</p>
                    <button type="button">Add to Cart</button>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="product-card">
                <img src="https://placehold.co/400x300/fef3c7/92400e?text=Shoes"
                     alt="Running shoes">
                <div class="product-info">
                    <h3>Running Shoes</h3>
                    <p class="price">₹1,899</p>
                    <button type="button">Add to Cart</button>
                </div>
            </div>

            <!-- Product 5 -->
            <div class="product-card">
                <img src="https://placehold.co/400x300/e0e7ff/3730a3?text=Speaker"
                     alt="Bluetooth speaker">
                <div class="product-info">
                    <h3>Bluetooth Speaker</h3>
                    <p class="price">₹1,299</p>
                    <button type="button">Add to Cart</button>
                </div>
            </div>

            <!-- Product 6 -->
            <div class="product-card">
                <img src="https://placehold.co/400x300/ffedd5/9a3412?text=Keyboard"
                     alt="Mechanical keyboard">
                <div class="product-info">
                    <h3>Mechanical Keyboard</h3>
                    <p class="price">₹2,199</p>
                    <button type="button">Add to Cart</button>
                </div>
            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 ShopZone | Assignment 7.3</p>
    </footer>

</body>
</html>
